name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
      - run: bun add -d @earendil-works/pi-coding-agent @earendil-works/pi-tui
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: python -m pip install -q -r vendor/pi-graph/requirements.txt
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m unittest discover -s tests -v
