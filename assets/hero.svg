<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Firstmate Graph control plane</title>
  <desc id="desc">One captain conversation flows through a durable Firstmate Graph control plane into persistent Herdr workers. High-assurance work passes implement, test, and exact-SHA review gates before ready work or decisions return to the captain, who keeps merge authority.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#3fb950"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { fill: #8b949e; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .label { fill: #f0f6fc; font-size: 18px; font-weight: 700; }
      .body { fill: #c9d1d9; font-size: 15px; }
      .small { fill: #8b949e; font-size: 13px; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="22" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Quiet chart lines: nautical without becoming decoration. -->
  <path d="M0 454 C90 438 150 470 240 454 S390 438 480 454 S630 470 720 454 S870 438 960 454 S1110 470 1200 454" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M0 476 C90 460 150 492 240 476 S390 460 480 476 S630 492 720 476 S870 460 960 476 S1110 492 1200 476" fill="none" stroke="#161b22" stroke-width="2"/>

  <text x="48" y="48" class="sans eyebrow">ONE THREAD</text>
  <text x="374" y="48" class="sans eyebrow">DURABLE CONTROL PLANE</text>
  <text x="840" y="48" class="sans eyebrow">PERSISTENT HERDR CREW</text>

  <!-- Captain / single conversation. -->
  <circle cx="92" cy="104" r="26" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <path d="M92 86V117M80 101H104M84 117C88 125 96 125 100 117" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="132" y="101" class="sans label">Captain</text>
  <text x="132" y="123" class="sans small">talk normally</text>

  <rect x="48" y="158" width="262" height="92" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="68" y="187" class="mono small">YOU ›</text>
  <text x="68" y="215" class="sans body">fix the API and audit web</text>
  <text x="68" y="236" class="sans small">one request · two tasks</text>

  <rect x="48" y="308" width="262" height="90" rx="12" fill="#111820" stroke="#d29922" stroke-width="1.5"/>
  <text x="68" y="337" class="sans eyebrow" fill="#d29922">AUTHORITY STAYS HERE</text>
  <text x="68" y="365" class="sans label">Merge?</text>
  <text x="145" y="365" class="mono body" fill="#d29922">captain only</text>
  <text x="68" y="385" class="sans small">never granted by away mode</text>

  <!-- The captain's outbound line. -->
  <path d="M310 204H352" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Central control plane, shaped like a compact deck rather than a dashboard grid. -->
  <path d="M374 78H760V388H400L374 360Z" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M374 132H760" stroke="#30363d"/>
  <text x="402" y="105" class="sans label">⚓  FIRSTMATE GRAPH</text>
  <text x="402" y="124" class="sans small">high-assurance path · one persistent Pi captain</text>

  <line x1="412" y1="166" x2="412" y2="303" stroke="#30363d" stroke-width="2"/>
  <circle cx="412" cy="174" r="7" fill="#3fb950"/>
  <text x="438" y="180" class="mono body">01  IMPLEMENT</text>
  <text x="438" y="200" class="sans small">same identity</text>

  <circle cx="412" cy="230" r="7" fill="#58a6ff"/>
  <text x="438" y="236" class="mono body">02  TEST</text>
  <text x="438" y="256" class="sans small">bounded run</text>

  <circle cx="412" cy="286" r="7" fill="#d29922"/>
  <text x="438" y="292" class="mono body">03  REVIEW</text>
  <text x="438" y="312" class="sans small">exact SHA</text>

  <path d="M650 162V302" stroke="#30363d" stroke-dasharray="4 5"/>
  <text x="676" y="181" class="sans eyebrow">DURABLE</text>
  <text x="676" y="207" class="sans small">budgets</text>
  <text x="676" y="231" class="sans small">controls</text>
  <text x="676" y="255" class="sans small">evidence</text>
  <text x="676" y="279" class="sans small">recovery</text>

  <rect x="402" y="327" width="330" height="37" rx="8" fill="#0d1117" stroke="#238636"/>
  <circle cx="421" cy="345.5" r="5" fill="#3fb950"/>
  <text x="436" y="351" class="mono small" fill="#c9d1d9">supervisor · zero model turns while healthy</text>

  <!-- Work fans into real Herdr agents. -->
  <path d="M760 204H803V121H832" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M803 204V223H832" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M803 223V325H832" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <g>
    <rect x="840" y="80" width="312" height="82" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="866" cy="106" r="6" fill="#3fb950"/>
    <text x="884" y="111" class="mono body">worker 1 · api</text>
    <text x="866" y="138" class="sans small">Herdr tab · persistent identity</text>
  </g>
  <g>
    <rect x="840" y="182" width="312" height="82" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="866" cy="208" r="6" fill="#58a6ff"/>
    <text x="884" y="213" class="mono body">worker 2 · web</text>
    <text x="866" y="240" class="sans small">own worktree · live steering</text>
  </g>
  <g>
    <rect x="840" y="284" width="312" height="82" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="866" cy="310" r="6" fill="#d29922"/>
    <text x="884" y="315" class="mono body">reviewer · fresh</text>
    <text x="866" y="342" class="sans small">read-only · exact commit</text>
  </g>

  <!-- Only evidence and decisions travel back. -->
  <path d="M1128 366V424H191V400" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="486" y="409" width="342" height="34" rx="17" fill="#0d1117" stroke="#238636"/>
  <text x="657" y="431" class="mono small" fill="#3fb950" text-anchor="middle">ready work · questions · honest failures</text>
</svg>
