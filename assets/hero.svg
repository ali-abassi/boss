<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">BOSS turns one conversation into an operated software portfolio</title>
  <desc id="desc">Boss sets outcomes in one conversation. A COO control plane scopes and routes independent work to real persistent Pi agents in Herdr, runs deterministic tests and exact-SHA reviews, and returns only blockers, decisions, and ready work. Boss keeps merge authority.</desc>
  <rect width="1280" height="640" rx="30" fill="#0b0d10"/>
  <rect x="1" y="1" width="1278" height="638" rx="29" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Brand lockup. -->
  <g transform="translate(48 38)" fill="none" stroke="#b7f34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2v62"/>
    <path d="M14 8h23c13 0 21 7 21 16s-8 16-21 16H14"/>
    <path d="M14 40h25c14 0 23 7 23 17s-9 17-23 17H14"/>
  </g>
  <text x="130" y="73" fill="#f2ede3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="800" letter-spacing="9">BOSS</text>
  <text x="132" y="101" fill="#9ca3af" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="3">YOUR AI COO</text>
  <text x="1232" y="68" text-anchor="end" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2">ONE THREAD · MANY REPOS</text>

  <text x="48" y="165" fill="#f2ede3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="750">You set the outcome. Your COO runs operations.</text>
  <text x="48" y="198" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Real agents. Deterministic gates. Every consequential decision comes back to you.</text>

  <!-- Input, COO, and agent lanes. -->
  <rect x="48" y="252" width="250" height="156" rx="18" fill="#11151a" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="284" fill="#b7f34a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2">BOSS</text>
  <text x="72" y="319" fill="#f2ede3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700">Outcomes + priorities</text>
  <text x="72" y="351" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">One conversation</text>
  <text x="72" y="376" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">One decision queue</text>

  <path d="M298 330h62" stroke="#b7f34a" stroke-width="3"/>
  <path d="M349 321l14 9-14 9" fill="none" stroke="#b7f34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="365" y="232" width="290" height="196" rx="22" fill="#171c22" stroke="#b7f34a" stroke-width="2"/>
  <text x="393" y="269" fill="#b7f34a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2">YOUR COO</text>
  <text x="393" y="307" fill="#f2ede3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">Owns coordination</text>
  <text x="393" y="345" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">SCOPE   ASSIGN   STEER</text>
  <text x="393" y="373" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">WATCH   VERIFY   REPORT</text>
  <path d="M393 397h226" stroke="#30363d" stroke-width="2"/>

  <!-- The B-shaped routing spine. -->
  <path d="M655 282h32c31 0 31-42 67-42h32" fill="none" stroke="#b7f34a" stroke-width="3"/>
  <path d="M655 330h131" fill="none" stroke="#b7f34a" stroke-width="3"/>
  <path d="M655 378h32c31 0 31 42 67 42h32" fill="none" stroke="#b7f34a" stroke-width="3"/>
  <circle cx="786" cy="240" r="5" fill="#b7f34a"/>
  <circle cx="786" cy="330" r="5" fill="#b7f34a"/>
  <circle cx="786" cy="420" r="5" fill="#b7f34a"/>

  <text x="808" y="225" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">REAL HERDR PI AGENTS</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="804" y="240" width="428" height="58" rx="13" fill="#11151a" stroke="#30363d"/>
    <text x="828" y="274" fill="#f2ede3" font-size="14" font-weight="700">WORK ITEM 01</text>
    <text x="1012" y="274" fill="#9ca3af" font-size="13">isolated · persistent</text>

    <rect x="804" y="309" width="428" height="58" rx="13" fill="#11151a" stroke="#30363d"/>
    <text x="828" y="343" fill="#f2ede3" font-size="14" font-weight="700">WORK ITEM 02</text>
    <text x="1012" y="343" fill="#9ca3af" font-size="13">bounded · steerable</text>

    <rect x="804" y="378" width="428" height="58" rx="13" fill="#11151a" stroke="#30363d"/>
    <text x="828" y="412" fill="#f2ede3" font-size="14" font-weight="700">WORK ITEM 03</text>
    <text x="1012" y="412" fill="#9ca3af" font-size="13">tested · evidence-bound</text>
  </g>

  <!-- Evidence return. -->
  <path d="M1212 466v44H174v-76" fill="none" stroke="#f2ede3" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M166 447l8-14 8 14" fill="none" stroke="#f2ede3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="365" y="474" width="577" height="72" rx="16" fill="#11151a" stroke="#30363d"/>
  <text x="393" y="502" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">DETERMINISTIC CONTROL PLANE</text>
  <text x="393" y="529" fill="#f2ede3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">SCOPE  →  TEST  →  EXACT-SHA REVIEW  →  READY</text>

  <text x="48" y="585" fill="#b7f34a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">BLOCKERS · DECISIONS · READY WORK RETURN HERE</text>
  <text x="1232" y="585" text-anchor="end" fill="#f2ede3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">MERGE AUTHORITY: BOSS</text>
</svg>
